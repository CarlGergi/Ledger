name: ledger

services:
  postgres:
    image: postgres:17
    # A process orphaned in the container is adopted by PID 1. If that is Postgres, it
    # takes the process for a backend, and one that exits non-zero, such as a timed-out
    # health check's pg_isready, makes it restart every connection as if after a crash.
    init: true
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ledger-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 1s
      timeout: 10s
      retries: 30

  # A local mail catcher for the email demo: SMTP on 1025, a web inbox on 8025.
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  ledger-pg:
