[workspace]
resolver = "3"
members = [
    "crates/ledger-gateway",
    "crates/ledger-store",
    "crates/ledger-testkit",
    "crates/ledger-tools",
    "crates/sample-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
ledger-gateway = { path = "crates/ledger-gateway" }
ledger-store = { path = "crates/ledger-store" }
ledger-testkit = { path = "crates/ledger-testkit" }
ledger-tools = { path = "crates/ledger-tools" }
sample-agent = { path = "crates/sample-agent" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
http = "1"
rmcp = { version = "3.8", features = [
    "client",
    "macros",
    "reqwest",
    "schemars",
    "server",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
    "chrono",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-webpki",
] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
